<style>

html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
#stage{position:fixed;inset:0}

#tip{position:fixed;pointer-events:none;background:#f4f6fb;color:#121826;padding:7px 10px;border-radius:6px;font-size:13px;max-width:280px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:5}
#tip b{display:block;font-weight:600}
#tip span{font-family:var(--mono);font-size:11px;color:#4a5468;overflow-wrap:anywhere}
.panel{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));bottom:16px;width:360px;display:flex;flex-direction:column;gap:14px;
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:18px;z-index:4;min-height:0}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0}

.lede{color:#cdd3e1;line-height:1.55;margin:0;max-width:60ch}

.list .k{width:9px;height:9px;flex:none;border-radius:2px;background:var(--c)}

<script>
const B="https://www.braze.com";
// item: [name, path, kind, size]  kind n=in nav, o=live but off-nav, x=separate subdomain, c=collection (size = stacked floors)
const SECTIONS=[
 {id:"why",name:"Why Braze?",path:"/value-of-braze",css:"#e8d48a",
  desc:"A single persuasion page that leans hard on proof: customer case studies, Gartner Magic Quadrant leadership and Forrester's ROI study. It's the smallest district, built for evaluators who already know the category and want reasons to choose.",
  items:[["Why Braze?","/value-of-braze","n",8],["Case Studies","/customers","c",6],["Gartner MQ 2026","/resources/reports-and-guides/gartner-magic-quadrant-mmh-2026","n",4],["Forrester TEI study","/resources/reports-and-guides/the-total-economic-impact-of-braze","n",4]]},
 {id:"product",name:"Product",path:"/product",css:"#7d95ff",
  desc:"The largest district. Three platform pillars tower over it (Data Platform, BrazeAI, Cross-Channel), then the AI capabilities and core toolset, then a long street of channel pages from Email out to LINE and KakaoTalk. Several capability pages, including Feature Flags, Testing and Content Cards, are live but missing from the menu.",
  items:[["BrazeAI™","/product/brazeai","n",11],["Braze Data Platform","/product/braze-data-platform","n",11],["Cross-Channel Messaging","/product/cross-channel-messaging","n",11],
   ["The Braze Platform","/product/overview","n",9],["How Braze Works","/product","n",7],["Pricing","/pricing","n",6],
   ["BrazeAI Decisioning Studio™","/product/brazeai-decisioning-studio","n",8],["BrazeAI™ Agents","/product/ai-agents","n",8],["Journey Orchestration","/product/journey-orchestration","n",6],
   ["Reporting & Analytics","/product/reporting-analytics","n",5],["Creative Studio","/product/creative-studio","n",5],["Omnichannel Marketing Platform","/product/cross-channel-messaging/omnichannel-marketing-platform","o",2],
   ["Testing & Experimentation","/product/testing-experimentation","o",3],["Feature Flags","/product/feature-flags","o",3],["Trust","/product/trust","o",3],
   ["Email","/product/email","n",4.5],["Mobile App Messaging","/product/mobile-app-messaging","n",4.5],["Web Messaging","/product/web-messaging","n",4.5],
   ["SMS / RCS","/product/sms","n",4.5],["WhatsApp","/product/whatsapp","n",4.5],["In-App Messaging Platform","/product/mobile-app-messaging/in-app-messaging-platform","o",2],
   ["RCS for Business","/product/rcs-for-business","o",2],["Content Cards","/product/content-cards","o",2.5],["LINE","/product/line","n",3],
   ["KakaoTalk","/product/kakaotalk-messenger","n",3],["Media Audience Sync","/product/audience-sync","n",3]]},
 {id:"solutions",name:"Solutions",path:"/solutions/retail-and-ecommerce",css:"#45c7b5",
  desc:"Two ways in: by industry (eight verticals, plus an unlisted CPG page) and by business outcome (onboarding, acquisition, churn, engagement, productivity). A small 'Braze for' block speaks directly to startups and engineering teams.",
  items:[["Retail & eCommerce","/solutions/retail-and-ecommerce","n",6],["Financial Services","/solutions/financial-services","n",6],["Travel & Hospitality","/solutions/travel-hospitality","n",5],
   ["Media & Entertainment","/solutions/media-entertainment","n",5],["Sports","/solutions/sports","n",4.5],["Gaming","/solutions/gaming","n",4.5],
   ["On Demand","/solutions/on-demand","n",4.5],["QSR","/solutions/qsr","n",4.5],["CPG","/cpg","o",2.5],
   ["Optimize Onboarding","/solutions/optimize-onboarding","n",4],["Improve Acquisition","/solutions/improve-acquisition","n",4],["Reduce Churn","/solutions/reduce-churn","n",4],
   ["Increase Engagement","/solutions/increase-engagement","n",4],["Boost Productivity","/solutions/boost-productivity","n",4],["Braze for Startups","/braze-for-startups","n",5],
   ["Braze for Engineering","/braze-for-engineering","n",4],["ISVs","/isv","o",2]]},
 {id:"partners",name:"Partners",path:"/partners",css:"#bb94f2",
  desc:"The Braze Alloys ecosystem. The recruiting side (become a technology or solutions partner) lives on braze.com, while the partner directory and the partner portal float off on their own subdomains.",
  items:[["Braze Alloys","/partners","n",8],["Become a Partner","/partners/become-a-partner","n",5],["Technology Partner","/partners/become-a-braze-technology-partner","o",3],
   ["Solutions Partner","/partners/become-a-braze-solutions-partner","o",3],["Partner Marketplace","https://marketplace.braze.com/","x"],["Partner Portal","https://partner.braze.com/","x"]]},
 {id:"resources",name:"Resources",path:"/resources",css:"#f39a62",
  desc:"The densest district by page count. Collection towers for the blog, videos, webinars, reports and case studies hold hundreds of pages between them. Documentation, the learning and community subdomains, and the support pages sit alongside.",
  items:[["Blog","/resources/articles","c",12],["Videos","/resources/videos","c",10],["Webinars & Events","/resources/webinars-and-events","c",10],
   ["Resources Hub","/resources","n",7],["Reports & Guides","/resources/reports-and-guides","c",7],["Case Studies","/customers","c",6],
   ["Press Releases","/company/news","c",4],["Glossary","/resources/articles/glossary","n",3.5],["Infographics","/resources/infographics/how-to-improve-your-roas-with-braze","o",2],
   ["User Documentation","/docs","n",7],["User Guide","/docs/user_guide/home","n",5],["Developer Guide","/docs/developer_guide/home","n",5],
   ["Support Overview","/success","n",5],["Professional Services","/customer-support-services","n",4],["Customer Success","/customer-success","n",4],
   ["Customer Champions","/customer-champions","n",3.5],["Technical Support","/technical-support","o",2.5],["Bonfire Community","https://community.braze.com/","x"],
   ["Braze Learning","https://learning.braze.com/","x"],["Certification","https://learning.braze.com/page/certification","x"],["System Status","https://braze.statuspage.io/","x"]]},
 {id:"company",name:"Company",path:"/company",css:"#f07f9e",
  desc:"Corporate pages: about, careers, news and contact, with investor relations and ESG reporting on separate subdomains. The legal hub is a tall stack of roughly 40 policy and contract pages, from privacy and cookies to the DPA and subprocessor list.",
  items:[["Legal hub","/company/legal","c",9],["About Us","/company","n",8],["Careers","/company/careers","n",6],["News","/company/news","n",5],
   ["Contact & Locations","/company/contact","n",5],["How We Hire","/company/careers/how-we-hire","o",2.5],["Engineering Careers","/company/careers/engineering","o",2.5],
   ["Privacy Policy","/company/legal/privacy","n",3],["Terms of Service","/company/legal/terms","n",3],["Data Processing Addendum","/company/legal/dpa","n",3],
   ["Investor Relations","https://investors.braze.com/","x"],["ESG","https://esg.braze.com/overview/default.aspx","x"]]}
];
const HOME={name:"Home",css:"#c8f135",items:[["Get Started / Contact Sales","/get-started","n",6],["Free Trial","https://try.braze.com/free_trial?locale=en","x"],["Search","/search","n",3],["Log In (dashboard)","https://dashboard.braze.com/sign_in","x"]]};
const ORPHANS=["/brand","/forge","/forge-gateway","/bfcm","/guide-to-ai","/competitor","/graduate-from-legacy-clouds","/big-customer-stories","/email-marketing","/email-campaigns","/cross-channel","/cross-channel-customer-engagement-platform","/turnkey-customer-engagement-data-integration","/activate-data-to-fuel-better-results","/google-bigquery-with-braze","/brazeai-decisioning-studio","/free-trial","/esg-report","/techforequitablefuture","/the-evolution-of-customer-engagement","/customer-community","/dev-portal","/subscribe","/festival-of-marketing","/city-x-city-on-demand","/427-innovation-lab","/who-we-are","/case-studies","/web-test","/test-retail-ecomm"];

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const url=p=>p.startsWith("http")?p:B+p;
const disp=p=>p.startsWith("http")?p.replace(/^https:\/\//,"").replace(/\/$/,""):p;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ---------- scene ---------- */
const stage=document.getElementById("stage");
const NIGHT=0x0c0c0b;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(NIGHT);
scene.fog=new THREE.Fog(NIGHT,150,330);
const camera=new THREE.PerspectiveCamera(45,1,0.5,800);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.47;controls.minDistance=12;controls.maxDistance=300;

scene.add(new THREE.HemisphereLight(0xf1f0e8,0x0c0c0b,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.9);sun.position.set(60,110,40);scene.add(sun);
const rim=new THREE.DirectionalLight(0xc8f135,0.35);rim.position.set(-80,40,-60);scene.add(rim);

const ground=new THREE.Mesh(new THREE.CircleGeometry(160,96),new THREE.MeshStandardMaterial({color:0x161614,roughness:1}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(320,80,0x2a2a25,0x1d1d1a);grid.position.y=0.02;scene.add(grid);

const OFFC=new THREE.Color(0x6b7388);
const records=[];const pickables=[];
function mat(color,opts={}){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.55,metalness:.08,transparent:true,emissive:color.clone(),emissiveIntensity:0},opts));}

function building(item,x,z,secColor,secId){
  const [name,path,kind,size=4]=item;
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const rec={name,path,kind,sec:secId,group:g,mats:[],lines:[],pos:new THREE.Vector3(x,0,z),top:0};
  const add=(geo,color,y,ry=0)=>{const m=new THREE.Mesh(geo,mat(color));m.position.y=y;m.rotation.y=ry;m.userData.rec=rec;g.add(m);rec.mats.push(m.material);pickables.push(m);return m;};
  if(kind==="c"){
    for(let i=0;i<size;i++){add(new THREE.BoxGeometry(2.5,0.72,2.5),secColor.clone().offsetHSL(0,0,i%2?0.06:0),0.36+i*0.95,(i%3)*0.18);}
    rec.top=size*0.95;
  }else if(kind==="x"){
    const m=add(new THREE.BoxGeometry(2.2,1.4,2.2),secColor,11);
    m.material.opacity=0.55;m.material.baseOpacity=0.55;
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.9}));
    e.position.y=11;g.add(e);rec.lines.push(e.material);
    const tg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0.1,0),new THREE.Vector3(0,10.3,0)]);
    const t=new THREE.Line(tg,new THREE.LineDashedMaterial({color:secColor,dashSize:.5,gapSize:.4,transparent:true,opacity:.8}));
    t.computeLineDistances();g.add(t);rec.lines.push(t.material);
    rec.top=12;
  }else{
    const c=kind==="o"?secColor.clone().lerp(OFFC,.7):secColor;
    add(new THREE.BoxGeometry(2.2,size,2.2),c,size/2);
    rec.top=size;
  }
  records.push(rec);return rec;
}

/* districts on a ring around home */
const R=40;const districts={};
SECTIONS.forEach((s,i)=>{
  const a=-Math.PI/2+i*(Math.PI*2/SECTIONS.length);
  const d=new THREE.Vector3(Math.cos(a),0,Math.sin(a));const t=new THREE.Vector3(-d.z,0,d.x);
  const col=new THREE.Color(s.css);
  const n=s.items.length,cols=Math.ceil(Math.sqrt(n*1.2)),rows=Math.ceil(n/cols),sp=3.6;
  const depth=rows*sp,width=cols*sp;
  const center=d.clone().multiplyScalar(R);
  const plate=new THREE.Mesh(new THREE.BoxGeometry(width+2.4,0.3,depth+2.4),new THREE.MeshStandardMaterial({color:col.clone().lerp(new THREE.Color(NIGHT),.78),roughness:.9}));
  plate.position.copy(center).setY(0.15);plate.rotation.y=Math.atan2(d.x,d.z);scene.add(plate);
  // road from home plaza
  const len=R-depth/2-9;const road=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.12,len),new THREE.MeshStandardMaterial({color:col.clone().lerp(new THREE.Color(NIGHT),.55),roughness:.8}));
  road.position.copy(d.clone().multiplyScalar(9+len/2)).setY(0.08);road.rotation.y=Math.atan2(d.x,d.z);scene.add(road);
  s.items.forEach((it,k)=>{
    const r=Math.floor(k/cols),c=k%cols;
    const lr=(r-(rows-1)/2)*sp,lx=(c-(cols-1)/2)*sp;
    const p=center.clone().addScaledVector(d,lr).addScaledVector(t,lx);
    building(it,p.x,p.z,col,s.id);
  });
  districts[s.id]={center,d,t,size:Math.max(width,depth),col:s.css};
});
/* home plaza */
const plaza=new THREE.Mesh(new THREE.CylinderGeometry(8.5,8.5,0.4,48),new THREE.MeshStandardMaterial({color:0x22221f,roughness:.8}));plaza.position.y=.2;scene.add(plaza);
const homeRec=building(["Home","/","n",16],0,0,new THREE.Color(HOME.css),"home");
const beacon=new THREE.PointLight(0xc8f135,1.2,40);beacon.position.set(0,18,0);scene.add(beacon);
const halo=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.12,8,48),new THREE.MeshBasicMaterial({color:0xc8f135,transparent:true,opacity:.9}));halo.rotation.x=Math.PI/2;halo.position.y=17;scene.add(halo);
HOME.items.forEach((it,k)=>{const a=Math.PI/4+k*Math.PI/2;building(it,Math.cos(a)*5.6,Math.sin(a)*5.6,new THREE.Color(HOME.css),"home");});
/* outskirts */
ORPHANS.forEach((p,k)=>{
  const a=k/ORPHANS.length*Math.PI*2+0.13;const rr=74+((k*37)%9);
  building([p,p,"o",1.6+((k*53)%10)/5],Math.cos(a)*rr,Math.sin(a)*rr,new THREE.Color(0x8b93a8),"out");
});

/* floating labels */
const tagsEl=document.getElementById("tags");const tags=[];
function tag(text,pos,css){const el=document.createElement("div");el.className="tag";el.textContent=text;el.style.setProperty("--c",css);tagsEl.appendChild(el);tags.push({el,pos});return el;}
tag("Home",new THREE.Vector3(0,19.5,0),HOME.css).dataset.id="home";
SECTIONS.forEach(s=>{const D=districts[s.id];const top=Math.max(...records.filter(r=>r.sec===s.id).map(r=>r.top));tag(s.name,D.center.clone().setY(top+3),s.css).dataset.id=s.id;});
tag("Off-nav outskirts",new THREE.Vector3(0,6,-80),"#8b93a8").dataset.id="out";

/* ---------- tour ---------- */
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function districtView(id){const D=districts[id];const k=D.size/18;
  return{pos:D.center.clone().addScaledVector(D.d,-24*k).addScaledVector(D.t,12*k).setY(24*k+6),target:D.center.clone().setY(2)};}
const STEPS=[
 {key:"overview",eyebrow:"Overview",title:"The site as a city",css:"#c8f135",
  text:"braze.com is laid out here as six districts around the homepage. Taller buildings are pages Braze promotes harder; stacked towers are collections holding many pages; floating blocks live on separate subdomains; grey blocks on the edge of town are live pages no menu links to. The site also ships in six languages.",
  view:{pos:V(0,110,128),target:V(0,0,4)},focus:()=>true,legend:true},
 {key:"home",eyebrow:"Stop 1 · braze.com /",title:"Home",css:"#c8f135",
  text:"The homepage pitches one AI platform built for outcomes, then routes visitors into the three platform pillars, customer proof, analyst validation and resources. Two conversion paths sit in the header: Contact Sales and a free trial on try.braze.com. Existing customers leave through Log In to the dashboard.",
  view:{pos:V(16,26,32),target:V(0,6,0)},focus:r=>r.sec==="home",items:()=>[["Home","/","n"],...HOME.items]},
 ...SECTIONS.map((s,i)=>({key:s.id,eyebrow:`Stop ${i+2} · ${s.path}`,title:s.name,css:s.css,text:s.desc,view:districtView(s.id),focus:r=>r.sec===s.id,items:()=>s.items})),
 {key:"ext",eyebrow:"Stop 8 · handoffs",title:"Subdomains",css:"#ffffff",
  text:"Eleven destinations leave www.braze.com: the trial and dashboard login, the partner marketplace and portal, community, learning and certification, investor relations, ESG and the status page. Each one is a handoff where the design system, navigation and ownership usually change.",
  view:{pos:V(-30,72,92),target:V(0,8,0)},focus:r=>r.kind==="x",items:()=>records.filter(r=>r.kind==="x").map(r=>[r.name,r.path,"x",0,r])},
 {key:"out",eyebrow:"Stop 9 · not in navigation",title:"The outskirts",css:"#8b93a8",
  text:"About 30 indexed pages that no menu links to: event gateways for Forge and City x City, seasonal campaigns like BFCM, competitor and AI-guide landing pages, an older ESG report and a few leftover test pages. People reach them from ads, email and search rather than by browsing.",
  view:{pos:V(0,150,165),target:V(0,0,0)},focus:r=>r.sec==="out",items:()=>ORPHANS.map(p=>[p,p,"o"])}
];

let step=0,tween=null,playing=false,timer=null;
const bodyEl=document.getElementById("body"),stepN=document.getElementById("stepN"),bar=document.getElementById("bar");
bar.innerHTML=STEPS.map(()=>"<i></i>").join("");

function highlight(pred){
  records.forEach(r=>{const on=pred(r);
    r.mats.forEach(m=>{m.opacity=on?(m.baseOpacity||1):0.12;m.depthWrite=on;});
    r.lines.forEach(m=>{m.opacity=on?.85:.08;});});
  tags.forEach(t=>{const id=t.el.dataset.id;const s=STEPS[step];
    t.el.classList.toggle("dim",!(s.key==="overview"||s.key===id||(s.key==="home"&&id==="home")));});
}
function fly(view){
  const from={pos:camera.position.clone(),target:controls.target.clone()};
  if(reduce){camera.position.copy(view.pos);controls.target.copy(view.target);return;}
  tween={from,to:view,t0:performance.now(),dur:1700};
}
function kindLabel(k){return{n:"In main navigation",o:"Live page, not in main navigation",x:"Separate subdomain",c:"Content collection"}[k];}
function render(){
  const s=STEPS[step];
  stepN.textContent=`${String(step+1).padStart(2,"0")} / ${String(STEPS.length).padStart(2,"0")}`;
  [...bar.children].forEach((b,i)=>b.classList.toggle("on",i<=step));
  let html=`<div style="--c:${s.css}"><div class="eyebrow">${esc(s.eyebrow)}</div><h2>${esc(s.title)}</h2></div><p class="lede">${esc(s.text)}</p>`;
  if(s.legend){html+=`<div class="legend">
    <div><span class="list"><i class="k" style="--c:#7d95ff;display:inline-block"></i></span>In main nav</div>
    <div><i class="k o" style="display:inline-block;width:9px;height:9px;border:1.5px solid #8b93a8;border-radius:2px"></i>Live, off-nav</div>
    <div><i style="display:inline-block;width:9px;height:9px;border:1.5px dashed #fff;border-radius:2px"></i>Subdomain (floating)</div>
    <div><i style="display:inline-block;width:9px;height:9px;background:#f39a62;border-radius:2px;box-shadow:2px -2px 0 -0.5px #0c0c0b,2px -2px 0 0 #f39a62"></i>Collection (stacked)</div></div>
    <ul class="list">${SECTIONS.map(x=>`<li><a href="#" data-jump="${x.id}" style="--c:${x.css}"><i class="k"></i><span class="nm">${esc(x.name)}</span><span class="pt">${x.items.length} pages</span></a></li>`).join("")}</ul>`;}
  if(s.items){html+=`<ul class="list" style="--c:${s.css}">${s.items().map((it,i)=>`<li><a href="${url(it[1])}" target="_blank" rel="noopener" data-path="${esc(it[1])}" data-name="${esc(it[0])}"><i class="k ${it[2]}"></i><span class="nm">${esc(it[0])}</span><span class="pt">${esc(disp(it[1]))}</span></a></li>`).join("")}</ul>`;}
  bodyEl.innerHTML=html;bodyEl.scrollTop=0;
  highlight(s.focus);fly(s.view);
}
function go(i){step=(i+STEPS.length)%STEPS.length;render();}
function setPlay(on){playing=on;document.getElementById("play").textContent=on?"Pause tour":"Play tour";clearInterval(timer);
  if(on)timer=setInterval(()=>{if(step===STEPS.length-1){setPlay(false);return;}go(step+1);},8000);}
document.getElementById("prev").onclick=()=>{setPlay(false);go(step-1);};
document.getElementById("next").onclick=()=>{setPlay(false);go(step+1);};
document.getElementById("play").onclick=()=>{if(!playing&&step===STEPS.length-1)go(0);setPlay(!playing);};
addEventListener("keydown",e=>{if(e.key==="ArrowRight"){setPlay(false);go(step+1);}if(e.key==="ArrowLeft"){setPlay(false);go(step-1);}});
bodyEl.addEventListener("click",e=>{const j=e.target.closest("[data-jump]");if(j){e.preventDefault();setPlay(false);go(STEPS.findIndex(s=>s.key===j.dataset.jump));}});
/* list hover lights up the matching building */
let glow=null;
function setGlow(rec){if(glow)glow.mats.forEach(m=>m.emissiveIntensity=0);glow=rec;if(rec)rec.mats.forEach(m=>m.emissiveIntensity=.55);}
bodyEl.addEventListener("mouseover",e=>{const a=e.target.closest("[data-path]");if(!a)return;setGlow(records.find(r=>r.path===a.dataset.path&&r.name===a.dataset.name)||records.find(r=>r.path===a.dataset.path));});
bodyEl.addEventListener("mouseleave",()=>setGlow(selected));

/* picking */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=document.getElementById("tip"),selEl=document.getElementById("sel");
let selected=null,downAt=null;
function pick(ev){const r=renderer.domElement.getBoundingClientRect();mouse.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(pickables,false).find(h=>h.object.material.opacity>.3);return hit&&hit.object.userData.rec;}
renderer.domElement.addEventListener("pointermove",ev=>{
  if(ev.pointerType!=="mouse"){return;}
  const rec=pick(ev);
  if(rec){tip.hidden=false;tip.innerHTML=`<b>${esc(rec.name)}</b><span>${esc(disp(rec.path))}</span>`;tip.style.left=Math.min(ev.clientX+14,innerWidth-290)+"px";tip.style.top=(ev.clientY+14)+"px";renderer.domElement.style.cursor="pointer";}
  else{tip.hidden=true;renderer.domElement.style.cursor="";}
});
renderer.domElement.addEventListener("pointerdown",ev=>{downAt=[ev.clientX,ev.clientY];setPlay(false);tween=null;});
renderer.domElement.addEventListener("pointerup",ev=>{
  if(!downAt||Math.hypot(ev.clientX-downAt[0],ev.clientY-downAt[1])>5)return;
  const rec=pick(ev);selected=rec||null;setGlow(selected);
  if(!rec){selEl.hidden=true;return;}
  selEl.hidden=false;
  selEl.innerHTML=`<div class="eyebrow" style="--c:${rec.sec==="home"?HOME.css:(SECTIONS.find(s=>s.id===rec.sec)||{css:"#8b93a8"}).css}">${esc(kindLabel(rec.kind))}</div><b style="font-size:15px">${esc(rec.name)}</b><span class="pt">${esc(disp(rec.path))}</span><a href="${url(rec.path)}" target="_blank" rel="noopener">Open page ↗</a>`;
});
renderer.domElement.addEventListener("pointerleave",()=>{tip.hidden=true;});

/* loop */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const tmp=new THREE.Vector3();
function frame(now){
  if(tween){const k=Math.min(1,(now-tween.t0)/tween.dur),e=ease(k);
    camera.position.lerpVectors(tween.from.pos,tween.to.pos,e);controls.target.lerpVectors(tween.from.target,tween.to.target,e);if(k>=1)tween=null;}
  controls.update();
  if(!reduce){halo.position.y=17+Math.sin(now/600)*0.5;halo.rotation.z=now/1500;}
  renderer.render(scene,camera);
  const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;
  tags.forEach(t=>{tmp.copy(t.pos).project(camera);const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;
    t.el.style.display=vis?"":"none";if(vis)t.el.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-100%)`;});
  requestAnimationFrame(frame);
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
camera.position.set(0,110,128);controls.target.set(0,0,4);
render();requestAnimationFrame(frame);
</script>

</body>
</html>
