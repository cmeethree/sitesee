  let down=null;renderer.domElement.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);

  const tmp=new THREE.Vector3(),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function frame(now){
    if(tween){const k=Math.min(1,(now-tween.t0)/tween.dur),e=ease(k);camera.position.lerpVectors(tween.from.pos,tween.to.pos,e);controls.target.lerpVectors(tween.from.t,tween.to.t,e);if(k>=1)tween=null}
    controls.update();if(!reduce){halo.position.y=33+Math.sin(now/600)*.6;halo.rotation.z=now/1500}
    renderer.render(scene,camera);
    const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;
    tags.forEach(t=>{tmp.copy(t.pos).project(camera);const vis=tmp.z<1&&Math.abs(tmp.x)<1.05&&Math.abs(tmp.y)<1.05;t.el.style.display=vis?"":"none";if(vis)t.el.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-100%)`});
    requestAnimationFrame(frame);
  }
  const resize=()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix()};
  const ro=new ResizeObserver(resize);ro.observe(stage);resize();
  camera.position.set(0,150,165);controls.target.set(0,0,0);
  requestAnimationFrame(frame);
}
go(0);
}
{const b=document.getElementById('wnav');const f=()=>document.documentElement.style.setProperty('--top',b.offsetHeight+'px');f();new ResizeObserver(f).observe(b);}
</script>
